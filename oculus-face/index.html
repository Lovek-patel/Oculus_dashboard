<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Oculus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="glow"></div>

  <!-- ASLEEP -->
  <section id="screen-asleep" class="screen">
    <div class="asleep-clock" id="asleep-clock"></div>
  </section>

  <!-- MORNING -->
  <section id="screen-morning" class="screen">
    <div class="morning">
      <p class="morning-eyebrow" id="morning-date">—</p>
      <h1 class="morning-greeting" id="morning-greeting">Good morning.</h1>
      <p class="morning-weather" id="morning-weather">—</p>
      <p class="morning-first" id="morning-first"></p>
    </div>
  </section>

  <!-- DAY (focus or open, toggled with body[data-mode]) -->
  <section id="screen-day" class="screen">
    <header class="top">
      <div class="top-left">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date">—</div>
      </div>
      <div class="arc-wrap">
        <svg id="sun-arc" viewBox="0 0 320 96" preserveAspectRatio="xMidYMax meet">
          <path id="arc-path" d="M 14 86 A 146 146 0 0 1 306 86" />
          <circle id="arc-dot" r="5" cx="14" cy="86" />
        </svg>
        <div class="arc-labels">
          <span id="arc-sunrise">—</span>
          <span id="arc-sunset">—</span>
        </div>
      </div>
      <div class="top-right">
        <div class="weather" id="weather">—</div>
        <div class="sync-note" id="sync-note">—</div>
      </div>
    </header>

    <div class="now-band" id="now-band">
      <div class="now-tag" id="now-tag">now</div>
      <div class="now-title" id="now-title">Free time</div>
      <div class="now-time" id="now-time"></div>
    </div>

    <main class="content">
      <section class="panel panel-schedule" id="panel-schedule">
        <h2 class="panel-heading">Today</h2>
        <ol class="list" id="timeline-list"></ol>
      </section>

      <section class="panel panel-tasks" id="panel-tasks">
        <h2 class="panel-heading" id="tasks-heading">Tasks</h2>
        <ul class="list" id="task-list"></ul>
      </section>
    </main>

    <footer class="foot">
      <div class="day-bar"><div class="day-bar-fill" id="day-bar-fill"></div></div>
    </footer>
  </section>

  <script src="app.js"></script>
</body>
</html>
