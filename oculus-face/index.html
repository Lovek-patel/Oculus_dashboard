<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Oculus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NIGHT: near-black, almost nothing on screen -->
  <div id="night" class="screen">
    <div class="night-clock" id="night-clock"></div>
  </div>

  <!-- MORNING: greeting hero -->
  <div id="morning" class="screen">
    <div class="morning-wrap">
      <div class="morning-eyebrow" id="morning-date"></div>
      <h1 class="morning-greeting" id="morning-greeting">Good morning, Love.</h1>
      <div class="morning-sub" id="morning-weather">—</div>
      <div class="morning-first" id="morning-first"></div>
    </div>
  </div>

  <!-- DAY: the actual dashboard -->
  <div id="day" class="screen">
    <header class="bar">
      <div class="arc-wrap">
        <svg id="sun-arc" viewBox="0 0 300 90" preserveAspectRatio="xMidYMax meet">
          <path id="arc-path" d="M 15 80 A 135 135 0 0 1 285 80" />
          <circle id="arc-dot" r="4.5" cx="15" cy="80" />
        </svg>
        <div class="arc-labels">
          <span id="arc-sunrise">—</span>
          <span id="arc-sunset">—</span>
        </div>
      </div>
      <div class="bar-right">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date">—</div>
        <div class="weather" id="weather">—</div>
      </div>
    </header>

    <main class="grid">
      <section class="now-next">
        <div class="now-next-row" id="now-row">
          <div class="nn-label">now</div>
          <div class="nn-body">
            <div class="nn-title" id="now-title">Nothing on right now</div>
            <div class="nn-time" id="now-time"></div>
          </div>
        </div>
        <div class="now-next-row" id="next-row">
          <div class="nn-label">next</div>
          <div class="nn-body">
            <div class="nn-title" id="next-title">Nothing else today</div>
            <div class="nn-time" id="next-time"></div>
          </div>
        </div>
      </section>

      <section class="timeline">
        <div class="section-heading">Today</div>
        <ol id="timeline-list" class="timeline-list"></ol>
      </section>

      <section class="tasks">
        <div class="section-heading">Tasks</div>
        <ul id="task-list" class="task-list"></ul>
      </section>
    </main>

    <footer class="foot">
      <div class="day-progress">
        <div class="day-progress-fill" id="day-progress-fill"></div>
      </div>
      <div class="foot-text" id="sync-note">—</div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
